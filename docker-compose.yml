version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always
    # Exposed internally only inside the docker network

  # Frontend Build Service (Runs once to build static assets)
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend_builder
    volumes:
      - frontend-assets:/public_html

  # Nginx Web Server / Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: app_nginx
    restart: always
    ports:
      - "80:80"  # Expose port 80 to host/corporate network
    volumes:
      - frontend-assets:/var/www/html/frontend:ro
    depends_on:
      - backend
      - frontend-builder

volumes:
  frontend-assets:

