name: nginx-practice 

services:
  # FastAPI Backend Service (Internal Only)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nginx_practice_backend
    image: nginx_practice_backend
    restart: always
    networks:
      - app_net  # Only attached to internal network

  # Frontend Build Service (Runs once to build static assets)
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx_practice_frontend_builder
    image: nginx_practice_frontend_builder
    volumes:
      - frontend-assets:/public_html
    networks:
      - app_net  # Only attached to internal network

  # Nginx Reverse Proxy (Gateway)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_practice_nginx
    image: nginx_practice_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - frontend-assets:/var/www/html/frontend:ro
    depends_on:
      - backend
      - frontend-builder
    networks:
      - test_my_cloudflare_net  # Connects to Cloudflare Tunnel
      - app_net                 # Connects to backend

volumes:
  frontend-assets:

networks:
  test_my_cloudflare_net:
    name: test_my_cloudflare_net
    external: true
  app_net:
    driver: bridge