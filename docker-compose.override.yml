version: '3.8'

services:
  backend:
    # 1. Direct port access for testing FastAPI Swagger docs directly
    ports:
      - "8000:8000"
    # 2. Volume mount for live-reloading python code without rebuilding
    volumes:
      - ./backend:/app
    # 3. Enable Uvicorn auto-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Run React dev server with Hot Module Replacement (HMR)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # Standard Node environment running 'npm run dev'
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

