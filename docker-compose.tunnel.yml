name: test_cloudflare_tunnel

services:
   cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel_test
    restart: unless-stopped
    
    env_file:
      - ./backend/.env

    # cloudflared automatically reads TUNNEL_TOKEN from env_file
    command: tunnel --url http://nginx_practice_nginx:80
    networks:
      - test_my_cloudflare_net 

networks:
  test_my_cloudflare_net:
    name: test_my_cloudflare_net
    driver: bridge
    external: true
  